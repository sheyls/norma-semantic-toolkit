[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "norma-engine"
version = "1.0.0"
description = "NORMA — Normative Ontology for Regulatory Machine-readable Annotations"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# No third-party runtime dependencies — stdlib only (xml.etree, difflib, re, json)
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
norma-build = "norma_engine.cli.build:main"
norma-rules = "norma_engine.cli.rules:main"

[tool.setuptools.packages.find]
include = ["norma_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
