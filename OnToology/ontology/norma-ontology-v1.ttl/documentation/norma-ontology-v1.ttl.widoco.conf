
abstract=The NORMA ontology provides a formal semantic model for representing machine-readable legal norm annotations as reusable knowledge graph resources. It distinguishes between regulative norms and constitutive rules, represents legal conditions and their evaluated outcomes through an explicit trigger-event pattern, and captures the agents, actions, objects, sources, controlled vocabularies, and provenance metadata needed for traceable, interoperable, and professional-grade semantic publication.
