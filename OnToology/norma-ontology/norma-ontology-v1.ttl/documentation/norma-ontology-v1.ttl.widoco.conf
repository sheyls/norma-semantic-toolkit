
abstract=The NORMA ontology (norma-o) is a formal semantic model for representing legal norm annotations as structured, machine-readable knowledge graph resources. It organises legal knowledge across four concerns: the type and deontic classification of normative content; the legal context that gives each norm its meaning (conditions, agents, actions, objects, and sources); the provenance and lifecycle metadata of each annotation; and controlled vocabularies for binding force, compliance criticality, extraction method, and review status. Conditional applicability is made explicit through a reified n-ary trigger-event pattern. The ontology aligns with PROV-O for provenance, ELI for legal resource modelling, FOAF for agent-oriented metadata, and SKOS for controlled vocabularies, and provides informative alignments with LKIF-Core via SKOS mapping properties.
