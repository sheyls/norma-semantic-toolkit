<VirtualHost *:80>
    ServerName norma-toolkit.linkeddata.es

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ErrorLog ${APACHE_LOG_DIR}/norma-toolkit-error.log
    CustomLog ${APACHE_LOG_DIR}/norma-toolkit-access.log combined
</VirtualHost>
